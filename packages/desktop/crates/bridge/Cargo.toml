[package]
name = "celestia-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "HTTP bridge from Celestia Desktop (GPUI) to the Hono backend in apps/api"

[dependencies]
gpui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json", "cookies"] }

[dev-dependencies]
serde_json = "1"
