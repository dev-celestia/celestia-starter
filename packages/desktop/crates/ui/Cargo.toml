[package]
name = "celestia-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Reusable GPUI component library for the Celestia desktop app"

[dependencies]
gpui-kit.workspace = true
# Embeds the vendored Phosphor SVGs (assets/phosphor/**) as an AssetSource;
# reads from disk in debug, embeds in release.
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

[dev-dependencies]
# TestAppContext / #[gpui_kit::test] need test-support; test builds only.
gpui-kit = { workspace = true, features = ["test-support"] }
