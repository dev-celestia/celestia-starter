[workspace]
resolver = "3"
members = ["crates/ui", "crates/showcase"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
celestia-ui = { path = "crates/ui" }

# GPUI and the layers the component library still builds on. `gpui` is the
# framework itself. `gpui-base` (state machines, scroll, motion) and
# `gpui-component` (the styled widgets) used to arrive bundled inside the
# `gpui-kit` facade; they are depended on directly so no facade sits in
# between, and each import names the layer it actually comes from. Components
# are being rewritten onto `gpui` alone, family by family — see
# crates/ui/src/components/mod.rs.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-base = "0.6.6"
# tree-sitter features power the code editor's syntax highlighting
# (code_editor.rs).
gpui-component = { version = "0.6.6", features = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
] }
# The windowing backend. `gpui` does not depend on it; an application names it
# to open its first window (`application().run(..)`).
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[profile.dev]
debug = "limited"

# Dev builds keep the render / text / component layer optimized so scrolling and
# text shaping stay interactive while application code compiles fast.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
ropey = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }

[profile.release]
lto = "thin"
